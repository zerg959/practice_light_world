# pytest settings (path to settings, markers)
[pytest]
DJANGO_SETTINGS_MODULE = world_core.settings
python_files = tests.py test_* *_test
testpaths =
    tests
    items
    stations
    tariffs
    users
    slots
    hardware/tests
    rentals/tests
[tool.pytest.ini_options]
spec_test_format = "{result} {docstring_summary}"

